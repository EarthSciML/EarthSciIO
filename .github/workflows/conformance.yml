name: conformance

# Cross-language conformance gate (esio-9nb.9): the same loader + the same cached
# corpus blob must decode to the SAME native arrays in Python, Julia, and Rust.
# Strictly OFFLINE — the corpus is a pre-populated $EARTHSCIDATADIR and no step
# touches the network. See conformance/CROSSLANG.md and spec/conformance.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-language:
    name: Python / Julia / Rust native-array equality (offline)
    runs-on: ubuntu-latest
    env:
      # Belt-and-suspenders: every track also honors this switch (the dumpers
      # already force offline caches rooted at the corpus).
      EARTHSCI_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      # --- Python track ---------------------------------------------------- #
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Every extra a corpus case's format needs must be installed here, because
      # each one is needed TWICE over — by the Python reader the cross-language
      # step drives, AND by the oracle in `verify.py` that the self-check runs:
      #   netcdf     `era5-grid-sub-tile`      reader: xarray/netCDF4; oracle: xarray
      #   shapefile  `shapefile-polygon-zip`   reader + oracle + `generate.py`: pyshp
      #   zarr       `isrm-zarr-tile`,         reader: zarr-python 3.x (store-backed);
      #              `permuted-order-tile`     oracle: numcodecs Blosc (spec/conformance.md
      #                                        "Zarr decode notes / Compression")
      #   geotiff    `landfire-raster-tile`    reader: rasterio (GDAL); oracle +
      #                                        generate.py: tifffile (deliberately
      #                                        NOT the reader's backend)
      # The `zarr` extra pulls both zarr>=3 and numcodecs; it needs Python >=3.11,
      # which is what this job pins above. The `geotiff` extra pulls rasterio AND
      # tifffile. `csv`/`ff10` need no extra (stdlib).
      - name: Install Python track (+ netcdf/shapefile/zarr/geotiff reader stacks, schema validator)
        run: python -m pip install --upgrade pip && pip install -e ".[netcdf,shapefile,zarr,geotiff,test]"

      # --- Julia track ----------------------------------------------------- #
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - name: Instantiate Julia track
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'

      # --- Rust track ------------------------------------------------------ #
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build Rust conformance dumper
        run: cargo build --quiet --manifest-path rust/Cargo.toml --example conformance_dump

      # --- The gate -------------------------------------------------------- #
      - name: Corpus self-check (oracle + JSON schemas, offline)
        run: python conformance/verify.py
      - name: Cross-language native-array equality (offline)
        run: ./conformance/run_conformance.sh "${{ runner.temp }}/conformance-dumps"
      - name: Upload native-array dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-array-dumps
          path: ${{ runner.temp }}/conformance-dumps/*.json
          if-no-files-found: ignore
