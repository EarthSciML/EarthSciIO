# Dependabot version updates: one grouped pull request per ecosystem per week,
# so routine bumps arrive together instead of one PR per dependency. Security
# updates for a dependency with an advisory are separate and not grouped; they
# are switched on in the repository settings, not here.
version: 2
updates:
  - package-ecosystem: "julia"
    directory: "/julia"
    schedule:
      interval: "weekly"
    groups:
      julia:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
