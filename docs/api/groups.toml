# Topic grouping of the canonical STABLE operations, for the generated API
# reference (tools/api_docs/render.py in EarthSciML/earthsci.dev).

[[group]]
id = "cache"
title = "Cache"
description = "Fetching a resolved URL into the shared content-addressed cache, validating what is stored, and reading it back offline."
ops = ["cache", "cache_entry", "cache_key", "sha256_file", "is_offline", "data_dir",
       "file_source_is_current", "file_source_state", "manifest", "temporal"]

[[group]]
id = "providers"
title = "Providers"
description = "Binding a data source to the cache and a reader, and getting native-grid arrays out at the simulation's cadence."
ops = ["provider", "data_source", "source_temporal", "window", "const_provider", "discrete_provider",
       "materialize", "refresh", "refresh_times", "prefetch"]

[[group]]
id = "prefetch"
title = "Prefetch and windows"
description = "Decoding upcoming forcing epochs on background workers, bitwise identical to refresh, and windowing a provider by named dimension so each rank reads only its block."
ops = ["dim_window", "select_form", "prefetch_group", "prefetch_sample", "epoch_sample",
       "prefetch_order", "sample_at", "with_window", "sample_windows_at",
       "boundaries", "start", "take", "cancel"]

[[group]]
id = "native-arrays"
title = "Native arrays and readers"
description = "The raw native-grid arrays a provider returns, and the format readers that decode cached files into them."
ops = ["native_field", "native_dataset", "csv_reader", "netcdf_reader", "geotiff_reader", "ff10_reader",
       "shapefile_reader", "parquet_reader", "zarr_reader"]

[[group]]
id = "writer"
title = "Streaming writer"
description = "Streaming a run's output into a sharded Zarr v3 store: region writes from many ranks without a gather, commit tokens delivered to one owner, indexed records, statics, blobs, read-back and resume."
ops = ["stream_writer", "stream_schema", "indexed_time", "writer_role", "region", "commit_token",
       "commit_receipt", "write_open", "write_resume", "write_record", "write_record_at",
       "write_static", "write_blob", "write_flush", "write_commit", "write_invalidate",
       "write_close", "read_output_manifest", "read_record", "read_static", "read_blob",
       "schema_fingerprint"]

[[group]]
id = "errors"
title = "Errors"
description = "What fails and how: offline misses, integrity failures and the general error."
ops = ["error", "cache_miss", "integrity_error", "region_not_shard_aligned", "commit_error"]
