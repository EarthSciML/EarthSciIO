<!doctype html>
<!--
  Drives harness/worker.js and parks the result on `window.__spike__` so any
  browser automation (or a human with devtools) can read it.

  Serve this over http://localhost — OPFS needs a secure context, and localhost
  counts as one. Build the module first:

    CC_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/clang \
    AR_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/llvm-ar \
    cargo build --release --target wasm32-unknown-unknown
    wasm-bindgen --target web --out-dir harness/pkg \
      target/wasm32-unknown-unknown/release/earthsciio_wasm_zarr_spike.wasm
-->
<meta charset="utf-8" />
<title>zarrs on wasm32 + OPFS — acceptance test</title>
<pre id="out">running…</pre>
<script type="module">
  const worker = new Worker("./worker.js", { type: "module" });
  worker.onmessage = (e) => {
    window.__spike__ = e.data;
    document.getElementById("out").textContent = JSON.stringify(e.data, null, 2);
  };
  worker.onerror = (e) => {
    window.__spike__ = { done: true, error: String(e.message || e) };
    document.getElementById("out").textContent = JSON.stringify(window.__spike__, null, 2);
  };
</script>
