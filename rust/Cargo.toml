[package]
name = "earthsciio"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
license = "AGPL-3.0-only"
description = "EarthSciIO Rust core: URL download + shared content-addressed cache (transport/store registries, offline mode)."
repository = "https://github.com/EarthSciML/EarthSciIO"
readme = "README.md"
keywords = ["earth-science", "cache", "data-loader", "netcdf", "offline"]
categories = ["caching", "science", "filesystem"]

# First data-loader machinery in the Rust track (component (a) of esio-9nb.6).
# Implements the language-neutral spec under ../spec: the shared cache + manifest
# format, the transport + store registries, EARTHSCIDATADIR resolution, offline
# mode, ETag/checksum/TTL validation, and the concurrency contract (advisory
# flock + atomic rename). Format readers (native arrays) are component (b).

# ============================================================================
# TARGET SPLIT — read this before adding a dependency.
#
# The crate builds for BOTH the host and `wasm32-unknown-unknown`, because the
# browser tier of earthscilab writes its run output with THIS writer rather than
# a JavaScript re-implementation (docs/output-handling.md §4.2/§4.6). wasm32
# gets the OUTPUT half only — the codec chain, the Zarr v3 writer and the OPFS
# store — and none of the cache/transport/reader machinery, every piece of which
# is native by construction:
#
#   reqwest/blocking  a blocking HTTP client needs threads and sockets
#   fs2               advisory flock is a POSIX/Windows syscall
#   tempfile          `tmp/<uuid>.part` staging on a real filesystem
#   netcdf-reader     memmaps the blob
#   tiff / csv / zip  readers of a cached blob, i.e. of a file path
#   zarrs `blosc`     blosc-src's vendored C does not cross-compile
#   zarrs `filesystem` there is no std::fs behind a browser tab
#
# So a dependency belongs in the shared `[dependencies]` table only if it builds
# and *means something* on both. Everything else goes in one of the two target
# tables below. `src/lib.rs` mirrors this split at the module level.
# ============================================================================

[dependencies]
sha2 = "0.10"                                          # cache key + content integrity (sha256)
serde = { version = "1", features = ["derive"] }       # manifest (de)serialization
serde_json = "1"                                        # manifest JSON (matches the Python writer)

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4"                                             # advisory file lock (flock) — spec §6
tempfile = "3"                                          # tmp/<uuid>.part staging on the cache filesystem
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }  # RFC 3339 fetched_at + TTL math

# HTTP(S) transport. rustls-tls pulls the *ring* crypto provider, which builds
# with a C compiler alone (no clang/bindgen) — so https works out of the box.
# default-features = false drops reqwest's native-tls (OpenSSL) default.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Pure-Rust GeoTIFF decode for the `geotiff` format reader (the USGS 3DEP /
# LANDFIRE rasters). No GDAL/FFI — same "C compiler alone, no clang/bindgen"
# build story as the rustls transport and the pure-Rust netcdf reader. 0.11
# retains unknown IFD tags (ModelPixelScale/Tiepoint) that 0.9 dropped, so the
# GeoTIFF georef axes (lon/lat) decode like the Python/Julia readers.
tiff = "0.11"

# Pure-Rust CSV + Zip decode for the `ff10` point reader. `csv` gives RFC-4180
# quote handling (the free-text FACILITY_NAME may embed the delimiter); `zip`
# extracts a named member from the `2016fd_inputs_point.zip` blob reader-side (the
# member is reader config, never part of the cache key). Both are pure Rust — the
# same "C compiler alone, no clang/bindgen" build story as the rest of the crate.
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# ============================================================================
# Zarr v3/v2 read + write via the mainstream `zarrs` crate (streaming-output-
# sinks RFC, Wave 4 "streaming-rust-libs"). This REPLACES the former hand-rolled
# blosc1 container decoder + `lz4_flex` path (git history: rust/src/format/zarr.rs
# used to decode the 16-byte blosc header + inverse byte-shuffle by hand).
#
# Why the change: the RFC's Zarr **v3 sharded** writer (blosc-zstd inner chunks,
# crc32c shard index, `sharding_indexed` codec) is far past what a hand-rolled
# decoder can sanely track, and `zarrs` is the reference Rust Zarr implementation
# (v3 sharding + codecs + v2 read). The crate's own code stays `#![forbid(unsafe_code)]`
# (that attribute governs THIS crate only; dependencies using `unsafe` internally
# is fine and does not break it).
#
# ---------------------------------------------------------------------------
# *** BUILD-STORY CHANGE — READ THIS ***
# The former "C compiler alone, NO C libraries" story is NARROWED, on purpose,
# per the user's explicit direction to adopt a 3rd-party library. `zarrs`'s
# default codec set builds two vendored C libraries from source:
#   * `zstd-sys`  (bundled zstd 1.5.x C source) — the zstd codec, and
#   * `blosc-src` (bundled c-blosc C source)    — the blosc codec (lz4 + zstd).
# Both compile with a **C compiler alone** (the vendored `cc`-driven build; no
# clang, no bindgen, no system libzstd/libblosc, no pkg-config) — so the crate
# still builds on a stock `cc`/`gcc` toolchain with NO clang. What changed vs.
# before is only that a C **compiler** is now REQUIRED at build time for these
# two vendored libraries (previously the zarr path was pure Rust). crc32c and
# sharding are pure Rust. `#![forbid(unsafe_code)]` in this crate is unaffected.
# ---------------------------------------------------------------------------
#
# Default features pulled in (see the `[features] default` list in zarrs):
#   filesystem (local read/write store), blosc, crc32c, sharding, zstd, gzip,
#   transpose, ndarray. `blosc`+`crc32c`+`sharding` are exactly what the RFC's
#   v3 sharded blosc-zstd+crc32c layout needs; `filesystem` backs the local
#   writer + the round-trip test; v2 read (the pinned ISRM corpus store) is
#   built in (zarrs converts v2 blosc metadata to a v3 codec chain on open).
#
# On wasm32 the feature set is narrowed — see the wasm32 target table below.
zarrs = "0.23"

# --- optional: direct (non-cache) object-storage Zarr via Apache Arrow
# `object_store` (feature `object-store`). This is where cloud access is backed
# by `object_store`'s mature clients rather than any hand-rolled vendor code, and
# it also gives a direct local/HTTP path. `object_store` is async, so it is
# bridged into the crate's sync Zarr reader/writer via zarrs'
# AsyncToSyncStorageAdapter (needs a tokio runtime + `zarrs/async`). Kept OFF by
# default so the default build stays lean: the cloud clients pull a TLS crypto
# backend (aws-lc-rs) and a tokio/reqwest stack. Content-addressed-cache S3 reads
# continue to work without this feature via the existing `s3` transport.
#
# STORAGE IS PROVIDER-AGNOSTIC BY CONSTRUCTION. `object_store::parse_url_opts`
# dispatches purely on URL scheme, so a provider is a feature flag on THIS
# dependency, never a code path in this crate. The four features below are the
# whole vendor surface:
#   aws   -> s3://, s3a://  (and *.amazonaws.com / *.r2.cloudflarestorage.com)
#   gcp   -> gs://
#   azure -> az://, adl://, azure://, abfs://, abfss://  (+ *.core.windows.net)
#   http  -> http://, https://
# `file://` comes from object_store's default `fs` feature and `memory://` is
# unconditional. gcp+azure share `cloud-base` with aws, so adding them costs a
# few modules, not a new dependency stack.
#
# S3-COMPATIBLE ENDPOINTS MATTER MORE THAN NEW CLOUDS: Cloudflare R2, MinIO,
# Backblaze B2 and Ceph are all "s3:// plus a configurable endpoint URL", which
# is why the reader/writer call `parse_url_opts` (options) rather than
# `parse_url` (no options — a builder that reads no environment and cannot
# express an endpoint). See src/format/zarr_object_store.rs for how a caller
# passes one.
object_store = { version = "0.14", optional = true, features = [
    "aws",
    "gcp",
    "azure",
    "http",
] }
zarrs_object_store = { version = "0.7", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread"] }
url = { version = "2", optional = true }

# Pure-Rust NetCDF decode for the `netcdf` format reader. netcdf-reader reads
# BOTH NetCDF-3 classic AND NetCDF-4 / HDF5 (superblock v2, deflate/shuffle),
# with no C/libnetcdf/HDF5 dependency — the same "C compiler alone, no
# clang/bindgen" build story as the rustls transport and the geotiff reader. It
# uses `unsafe` internally (memmap), but that is the dependency's code, not this
# crate's, so it stays compatible with `#![forbid(unsafe_code)]`.
#
# A published release, not a path or git dep. A relative path resolved against
# THIS crate's location on disk, so only a checkout with the sibling repo in
# exactly the right place could build; a git dep on the fork branch fixed that
# but still tied the build to a fork, and to cargo's libgit2 transport (which
# needs `net.git-fetch-with-cli` for anyone whose gitconfig rewrites
# `https://github.com/` to ssh). The rank-0 (scalar variable) DIMENSION_LIST fix
# that ERA5 files from the Copernicus CDS need — the reason for the fork — was
# merged upstream and shipped in 0.9.1, whose source is byte-identical to the
# fork revision pinned here before, so the release is a straight substitute.
netcdf-reader = { version = "0.9.1", default-features = false, features = ["netcdf4"] }

# ============================================================================
# wasm32 — the OUTPUT half of the crate, and nothing else.
#
# *** BUILDING FOR wasm32 — TWO NON-OBVIOUS REQUIREMENTS ***
#
#   CC_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/clang \
#   AR_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/llvm-ar \
#   cargo build --target wasm32-unknown-unknown --no-default-features --features opfs
#
# 1. A **wasm-capable clang**. `zstd-sys` compiles the vendored zstd C sources
#    with `cc`, and Apple's Xcode clang has no WebAssembly backend at all:
#      error: unable to create target: 'No available targets are compatible
#             with triple "wasm32-unknown-unknown"'
#    Homebrew's `llvm` (or any upstream LLVM / wasi-sdk) does. This is a
#    toolchain requirement, not a source change — zstd-sys ships a `wasm-shim/`
#    of libc headers precisely so no wasm sysroot is needed. CI implication: a
#    machine building this target needs LLVM on PATH, not just Xcode CLT.
#
# 2. **`zstd/no_asm`**. zstd-sys unconditionally feeds
#    `zstd/lib/decompress/huf_decompress_amd64.S` to the assembler unless the
#    `no_asm` feature is on (it only auto-disables for Windows), and x86-64
#    assembly does not assemble for wasm32. `zstd` is pinned as a direct
#    dependency below solely to turn that feature on for zarrs' copy through
#    cargo feature unification.
#
# Nothing else blocks: no source patches to zarrs, zstd or their dependencies.
# ============================================================================
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The RFC's `wasm` codec profile and NOTHING else: `sharding_indexed` +
# `crc32c` (both pure Rust) wrapping a plain v3 `zstd` chunk codec. Explicitly
# NOT `blosc` (blosc-src's C sources do not cross-compile), NOT `filesystem`
# (there is no std::fs behind a tab), NOT `async` (the OPFS store is sync).
zarrs = { version = "0.23", default-features = false, features = [
    "sharding",
    "crc32c",
    "zstd",
    "ndarray",
    "transpose",
] }
# Direct dependency ONLY to enable `no_asm` for zarrs' zstd — see note 2 above.
zstd = { version = "0.13", default-features = false, features = ["no_asm"] }
# `time`'s wasm-bindgen feature is what makes `OffsetDateTime::now_utc()` read
# JS `Date` instead of `SystemTime`, which is unimplemented on this target: the
# output manifest's `created_at` would otherwise panic the whole write.
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros", "wasm-bindgen"] }

# OPFS store (feature `opfs`). Optional so a wasm32 build that only wants the
# codec chain — e.g. writing into an in-memory store and handing the bytes to
# JS — does not link web-sys at all.
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
optional = true
features = [
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemReadWriteOptions",
    "FileSystemRemoveOptions",
    "FileSystemSyncAccessHandle",
]

# The cross-language conformance drivers are native programs — they walk the
# corpus off disk and drive a `Provider`. Declared with `required-features` so a
# `--no-default-features` build (which is how wasm32 is built) simply does not
# have these targets, rather than failing to compile a `main` that cannot exist.
[[example]]
name = "conformance_dump"
path = "examples/conformance_dump.rs"
required-features = ["conformance"]

[[example]]
name = "conformance_write"
path = "examples/conformance_write.rs"
required-features = ["conformance"]

[features]
default = ["conformance"]

# The `examples/conformance_*` drivers (see the `[[example]]` tables above).
# Enables no code in the library itself.
conformance = []

# Direct object_store-backed Zarr read/write, provider-agnostic: file://,
# memory://, s3:// (incl. every S3-compatible endpoint), gs://, az:// and
# http(s)://. Enables zarrs' async storage traits so the async object_store can
# drive the sync API.
object-store = ["dep:object_store", "dep:zarrs_object_store", "dep:tokio", "dep:url", "zarrs/async"]

# The Origin Private File System as a `zarrs` store (`src/format/zarr_opfs.rs`),
# so the browser tier writes its run output with THIS writer. **wasm32 only** —
# its dependencies live in the wasm32 target table, so enabling it on a native
# build is a hard error rather than a silently empty module (see `lib.rs`).
opfs = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dev-dependencies]
# Concurrency + mock-HTTP tests use only std (threads, TcpListener) — no extra deps.

# The wasm32 acceptance tests (`tests/zarr_wasm32.rs`, `tests/zarr_opfs.rs`) run
# under `wasm-bindgen-test-runner` — Node for the codec half, a real browser for
# the OPFS half, since OPFS does not exist in Node.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
